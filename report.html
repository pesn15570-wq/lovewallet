<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💕 รายงานแฟน</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Mali',cursive;background:linear-gradient(135deg,#FFE4EC,#FFC0CB,#FFB6C1);min-height:100vh;padding:16px;color:#C71585;}
  .container{max-width:500px;margin:0 auto;}
  .header{text-align:center;font-size:24px;font-weight:700;margin:12px 0;background:linear-gradient(135deg,#FF69B4,#FF1493);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .zone-label{font-size:15px;font-weight:700;color:#FF1493;margin:15px 0 8px;padding-left:4px;}
  .zone{background:rgba(255,255,255,0.9);border-radius:24px;padding:20px;margin-bottom:12px;border:2px solid rgba(255,255,255,0.95);box-shadow:0 6px 20px rgba(255,105,180,0.2);}
  .row{display:flex;justify-content:space-between;padding:11px 14px;background:linear-gradient(135deg,#FFF0F5,#FFE4EC);border-radius:14px;margin-bottom:8px;font-size:14px;font-weight:600;border:1px solid rgba(255,255,255,0.8);}
  button{width:100%;padding:15px;border:none;border-radius:20px;background:linear-gradient(135deg,#FFB6C1,#FF69B4);color:white;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;font-family:inherit;box-shadow:0 4px 14px rgba(255,105,180,0.35);transition:transform 0.15s;}
  button:active{transform:scale(0.96);}
  .secondary{background:linear-gradient(135deg,#FFC0CB,#FFB6C1);font-size:14px;}
  .loading{text-align:center;padding:40px;font-size:18px;color:#FF69B4;}
  textarea{width:100%;padding:13px;border:2px solid #FFE4EC;border-radius:15px;font-size:14px;font-family:inherit;resize:none;background:#FFF5F8;color:#C71585;}
  textarea:focus{outline:none;border-color:#FF69B4;}
  input[type="text"]{width:100%;padding:12px;border:2px solid #FFE4EC;border-radius:15px;font-size:18px;text-align:center;font-family:inherit;background:#FFF5F8;color:#C71585;}
  .emoji-picker{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center;}
  .emoji-picker span{font-size:24px;cursor:pointer;padding:4px 6px;border-radius:12px;transition:transform 0.2s;}
  .emoji-picker span:active{transform:scale(1.3);background:#FFE4EC;}
  #map{height:200px;border-radius:18px;margin:8px 0;border:2px solid white;}
  .pet-preview{text-align:center;padding:10px;}
  .pet-preview .dog{font-size:70px;display:inline-block;animation:dogIdle 3s ease-in-out infinite;}
  @keyframes dogIdle{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-8px,0)}}
  .pet-stat{display:flex;gap:10px;margin-top:10px;}
  .pet-stat > div{flex:1;background:#FFF0F5;padding:8px;border-radius:12px;font-size:12px;font-weight:600;}
  .bar-mini{background:#FFE4EC;border-radius:8px;height:8px;margin-top:4px;overflow:hidden;}
  .bar-mini-fill{height:100%;border-radius:8px;transition:width 0.5s;}
  .money-zone{border:3px solid #FF69B4;box-shadow:0 6px 20px rgba(255,105,180,0.35);}
  .remain-big{text-align:center;font-size:52px;font-weight:700;background:linear-gradient(135deg,#FF69B4,#FF1493);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin:8px 0;}
</style>
</head>
<body>
<div class="container">
  <div class="header">💕 รายงานแฟนจ้า</div>

  <!-- เงิน (บนสุด) -->
  <div class="zone-label">💰 เงินของแฟน</div>
  <div class="zone money-zone" id="summary"><div class="loading">กำลังโหลดน้า 💕</div></div>

  <!-- ประวัติ -->
  <div class="zone-label">📜 ประวัติ</div>
  <div class="zone" id="list"></div>

  <!-- สัตว์เลี้ยง -->
  <div class="zone-label">🐶 โบโบ้</div>
  <div class="zone">
    <div class="pet-preview">
      <div class="dog" id="dogPreview">🐶</div>
      <div style="font-size:13px;font-weight:600;margin-top:6px;" id="petLevelText">Lv.1</div>
    </div>
    <div class="pet-stat">
      <div>🍖 อิ่ม<div class="bar-mini"><div class="bar-mini-fill" id="hungerBar" style="width:100%;background:linear-gradient(90deg,#FFB6C1,#FF69B4);"></div></div></div>
      <div>💕 สุข<div class="bar-mini"><div class="bar-mini-fill" id="happyBar" style="width:100%;background:linear-gradient(90deg,#FFD700,#FFA500);"></div></div></div>
    </div>
  </div>

  <!-- แผนที่ -->
  <div class="zone-label">📍 ตำแหน่งแฟน</div>
  <div class="zone">
    <div id="map"></div>
    <div style="font-size:12px;background:rgba(255,240,245,0.9);padding:8px 12px;border-radius:12px;margin-top:8px;line-height:1.5;" id="locationInfo">กำลังโหลด...</div>
  </div>

  <!-- ส่งข้อความ -->
  <div class="zone-label">💌 ส่งข้อความหาแฟน</div>
  <div class="zone">
    <input type="text" id="msgEmoji" value="💕" maxlength="2">
    <div class="emoji-picker" id="emojiPicker"></div>
    <textarea id="msgText" rows="2" placeholder="พิมพ์ข้อความน่ารักๆ..."></textarea>
    <button onclick="sendMessage()">💕 ส่งเลย</button>
  </div>

  <button onclick="loadData()">🔄 รีเฟรช</button>
  <button onclick="resetMonth()" class="secondary">🔄 รีเซ็ตเดือนนี้</button>
  <button onclick="resetAll()" class="secondary">🗑 ลบข้อมูลทั้งหมด</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const firebaseConfig = { databaseURL: "https://lovewallet-71a77-default-rtdb.asia-southeast1.firebasedatabase.app" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let map, marker;

const pickerEmojis = ['💕','💖','🎀','🌸','🐻','🐼','🐰','✨','💗','🥰','😘','💝'];
const picker = document.getElementById('emojiPicker');
pickerEmojis.forEach(e => {
  const s = document.createElement('span');
  s.textContent = e;
  s.onclick = () => { document.getElementById('msgEmoji').value = e; };
  picker.appendChild(s);
});

function initMap() {
  if (map) return;
  map = L.map('map', { attributionControl: false }).setView([13.7563, 100.5018], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
  const dogIcon = L.divIcon({ html: '<div style="font-size:30px;text-align:center;">🐶</div>', className: '', iconSize: [40, 40], iconAnchor: [20, 40] });
  marker = L.marker([13.7563, 100.5018], { icon: dogIcon }).addTo(map);
  db.ref('location').on('value', snap => {
    const loc = snap.val();
    if (loc && loc.lat) {
      map.setView([loc.lat, loc.lng], 16);
      marker.setLatLng([loc.lat, loc.lng]);
      document.getElementById('locationInfo').innerHTML = '📍 <b>ล่าสุด</b><br>ละติจูด: ' + loc.lat.toFixed(5) + '<br>ลองจิจูด: ' + loc.lng.toFixed(5) + '<br>อัปเดต: ' + loc.time;
    }
  });
}

function loadPet() {
  db.ref('pet').on('value', snap => {
    const p = snap.val() || { hunger: 100, happy: 100, level: 1 };
    document.getElementById('hungerBar').style.width = p.hunger + '%';
    document.getElementById('happyBar').style.width = p.happy + '%';
    document.getElementById('petLevelText').textContent = 'Lv.' + (p.level || 1);
    document.getElementById('dogPreview').textContent = p.happy < 30 ? '😢' : p.hunger < 30 ? '🐕' : '🐶';
  });
}

function loadData() {
  document.getElementById('summary').innerHTML = '<div class="loading">กำลังโหลดน้า 💕</div>';
  db.ref('expenses').orderByChild('timestamp').once('value').then(snapshot => {
    const data = [];
    snapshot.forEach(c => data.push(c.val()));
    if (data.length === 0) {
      document.getElementById('summary').innerHTML = '<div style="text-align:center;padding:20px;">ยังไม่มีรายการน้า 🐰</div>';
      document.getElementById('list').innerHTML = '';
      return;
    }
    const now = new Date();
    const todayKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    const tt = data.filter(e => e.day_key === todayKey).reduce((s, e) => s + e.amount, 0);
    const remainToday = Math.max(0, 100 - tt);

    document.getElementById('summary').innerHTML = `
      <div style="text-align:center;font-size:15px;font-weight:600;color:#FF69B4;">🧸 เหลือวันนี้</div>
      <div class="remain-big">${remainToday} บาท</div>
      <div style="text-align:center;font-size:14px;font-weight:600;">ใช้ไปวันนี้ ${tt} บาท</div>
    `;
    let html = '';
    [...data].reverse().slice(0, 30).forEach(r => {
      html += `<div class="row"><span>${r.category || ''} ${r.item} (${r.time})</span><span>${r.amount} บาท 🎀</span></div>`;
    });
    document.getElementById('list').innerHTML = html;
  });
}

function sendMessage() {
  const emoji = document.getElementById('msgEmoji').value || '💕';
  const text = document.getElementById('msgText').value.trim();
  if (!text) { alert('พิมพ์ข้อความก่อนน้า 💕'); return; }
  const now = new Date();
  db.ref('messages/' + Date.now()).set({
    emoji, text,
    time: now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH', {hour:'2-digit',minute:'2-digit'}),
    timestamp: Date.now()
  }).then(() => {
    alert('ส่งแล้วน้า 💕');
    document.getElementById('msgText').value = '';
  });
}

function resetMonth() {
  const month = new Date().toISOString().slice(0, 7);
  if (!confirm('รีเซ็ตเดือนนี้เลยไหม? 🥺')) return;
  db.ref('expenses').once('value').then(snap => {
    snap.forEach(c => { if (c.val().date_key === month) c.ref.remove(); });
    setTimeout(() => { alert('รีเซ็ตแล้ว 🎀'); loadData(); }, 500);
  });
}

function resetAll() {
  if (!confirm('ลบข้อมูลทั้งหมดเลยไหม? ⚠️')) return;
  db.ref('expenses').remove().then(() => { alert('ลบแล้ว 🎀'); loadData(); });
}

loadData();
loadPet();
setTimeout(initMap, 300);
</script>
</body>
</html>
